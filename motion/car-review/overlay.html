<meta charset="utf-8">
<title>overlay-car</title>
<style>
@font-face{font-family:MT;src:url('../fonts/Montserrat-900.ttf');font-weight:900}
@font-face{font-family:MT;src:url('../fonts/Montserrat-800.ttf');font-weight:800}
@font-face{font-family:IN;src:url('../fonts/Inter-900.ttf');font-weight:900}
@font-face{font-family:IN;src:url('../fonts/Inter-800.ttf');font-weight:800}
@font-face{font-family:IN;src:url('../fonts/Inter-600.ttf');font-weight:600}
@font-face{font-family:PF;src:url('../fonts/PlayfairIt-600.ttf');font-style:italic;font-weight:600}
@font-face{font-family:PF;src:url('../fonts/PlayfairIt-500.ttf');font-style:italic;font-weight:500}

:root{ --y:#FFC93C; --y2:#FFE08A; --r:#FF3B30; --ink:#080D14; --w:#fff; }
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:transparent}
body{width:720px;height:1280px;overflow:hidden;position:relative;font-family:IN,sans-serif;
     -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
#stage{position:absolute;inset:0}
.sh{text-shadow:0 4px 20px rgba(0,0,0,.85),0 0 3px rgba(0,0,0,.85),
    2px 2px 0 rgba(8,13,20,.5),-2px 2px 0 rgba(8,13,20,.5),
    2px -2px 0 rgba(8,13,20,.5),-2px -2px 0 rgba(8,13,20,.5)}

/* --- altyazı paneli --------------------------------------------------------
   Kaynakta yanmış altyazı var ve 360p'de temiz silinemiyor; delogo sonrası
   kalan leke bu panelin altında kalıyor. Eskiden ekranın 470 px'ini kaplayan
   bulanık siyah gradyan yerine, altyazıyı taşıyan 194 px'lik tanımlı bir
   panel — karartılan alan %62 azaldı ve kaza değil tasarım gibi duruyor.   */
#plate{position:absolute;left:32px;right:32px;top:648px;height:194px;z-index:2;
  border-radius:20px;background:rgba(9,16,26,.62);
  box-shadow:0 18px 46px rgba(0,0,0,.34)}
#plate::before{content:'';position:absolute;left:26px;right:26px;top:0;height:3px;
  border-radius:3px;background:linear-gradient(90deg,transparent,var(--y),transparent)}

/* --- konuşmacı çipi --- */
#who{position:absolute;left:0;right:0;top:602px;text-align:center;z-index:6}
#who span{display:inline-block;font:800 21px/1 IN;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);background:var(--y);padding:8px 16px;border-radius:8px;
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
#who.guest span{background:#fff}

/* --- kinetik altyazı --- */
#cap{position:absolute;left:46px;right:46px;top:648px;height:194px;z-index:6;
  display:flex;align-items:center;justify-content:center}
#capTxt{width:100%;text-align:center;
  font:900 48px/1.14 IN;letter-spacing:-.018em;color:var(--w)}
#capTxt .wi{display:inline-block;margin:0 .10em;will-change:transform,opacity}
/* boyut hiyerarşisi — hepsi aynı puntoda olunca satır düz kalıyor */
#capTxt .hi{font-size:64px;color:var(--y)}                 /* vurgu: büyük + renkli */
#capTxt .sm{font-size:36px;font-weight:800;opacity:.60}    /* bağlaç: küçük + soluk */
#capTxt .q{font:italic 500 54px/1.14 PF;letter-spacing:0}  /* alıntı: italik serif */
#capTxt .hi.q{font:italic 600 68px/1.14 PF;color:var(--y)}
#capTxt .ch{display:inline-block;will-change:transform,opacity}

/* --- 1) DENKLEM: videonun tezi — aynı bütçe, iki araba --- */
#eqn{position:absolute;left:0;right:0;top:248px;z-index:7}
#eqRow{display:flex;align-items:stretch;justify-content:center}
.plate{width:272px;border-radius:22px;padding:26px 18px;text-align:center;
  background:rgba(10,15,22,.88);border:1px solid rgba(255,255,255,.13);
  box-shadow:0 22px 50px rgba(0,0,0,.5);will-change:transform,opacity}
.plate.b{background:var(--y);border-color:rgba(0,0,0,.12)}
.plate .n{font:900 46px/1 MT;letter-spacing:-.02em;color:#fff}
.plate.b .n{color:var(--ink)}
.plate .s{margin-top:10px;font:700 19px/1.25 IN;letter-spacing:.05em;text-transform:uppercase;
  color:rgba(255,255,255,.50)}
.plate.b .s{color:rgba(8,13,20,.60)}
#eqSign{width:84px;display:flex;align-items:center;justify-content:center;
  font:900 58px/1 MT;color:#fff;will-change:transform,opacity}
#eqLab{margin-top:24px;text-align:center;font:800 22px/1 IN;letter-spacing:.34em;
  text-transform:uppercase;color:var(--y);will-change:opacity}

/* --- 2) ALGI ÇUBUĞU: "gemi gibi" sözünü görselleştirir --- */
#gauge{position:absolute;left:80px;right:80px;top:288px;z-index:7}
#gaLab{font:800 21px/1 IN;letter-spacing:.26em;text-transform:uppercase;
  color:rgba(255,255,255,.72);margin-bottom:15px;text-align:center;
  text-shadow:0 3px 14px rgba(0,0,0,.8)}
#gaBar{display:flex;gap:8px;justify-content:center}
#gaBar i{width:66px;height:36px;border-radius:8px;background:rgba(255,255,255,.18);
  box-shadow:0 6px 16px rgba(0,0,0,.35);will-change:transform,background-color}
#gaTag{margin-top:20px;text-align:center;font:900 44px/1 MT;color:var(--y);
  will-change:transform,opacity}

/* --- 3) SORULMAYANLAR: hiç işaretlenmeyen onay kutuları --- */
#ask{position:absolute;left:296px;top:214px;width:392px;border-radius:22px;padding:22px 20px 24px;
  background:rgba(10,15,22,.91);border:1px solid rgba(255,255,255,.12);
  box-shadow:0 26px 58px rgba(0,0,0,.5);z-index:7;will-change:transform,opacity}
#askLab{font:800 19px/1 IN;letter-spacing:.22em;text-transform:uppercase;color:var(--r)}
.askRow{display:flex;align-items:flex-start;gap:13px;margin-top:18px;
  will-change:transform,opacity}
.askRow b{flex:0 0 28px;height:28px;border-radius:7px;margin-top:2px;
  border:2px solid rgba(255,255,255,.32);background:rgba(255,255,255,.05)}
.askRow span{font:700 26px/1.25 IN;color:rgba(255,255,255,.92)}

/* --- BMW impact: ışın yok, sert vuruş + genişleyen çizgi --- */
#imp{position:absolute;inset:0;z-index:9;background:rgba(6,10,16,.74)}
#impTxt{position:absolute;left:0;right:0;top:404px;text-align:center;
  font:900 154px/1 MT;letter-spacing:-.045em;color:#fff}
#impRule{position:absolute;left:50%;top:600px;height:5px;width:0;margin-left:0;
  background:var(--y);border-radius:3px}
#impSub{position:absolute;left:0;right:0;top:630px;text-align:center;
  font:800 25px/1 IN;letter-spacing:.34em;text-transform:uppercase;color:var(--y)}

/* --- blurlu istif listesi --- */
#stack{position:absolute;left:78px;right:78px;top:352px;z-index:7}
#stack div{font:900 46px/1.42 IN;letter-spacing:-.015em;color:rgba(255,255,255,.42);
  will-change:transform,opacity}
#stack div.cur{color:#fff}

/* --- final özet kartı --- */
#fin{position:absolute;left:40px;top:196px;width:640px;border-radius:32px;z-index:8;
  background:linear-gradient(160deg,#101E31 0%,#0A1626 58%,#060F1B 100%);
  box-shadow:0 40px 90px rgba(0,0,0,.55);padding:34px 30px 38px;will-change:transform,opacity}
#finLab{text-align:center;font:800 21px/1 IN;letter-spacing:.32em;text-transform:uppercase;
  color:rgba(255,255,255,.45);margin-bottom:26px}
#finCols{display:flex;gap:22px}
.fcol{width:279px;border-radius:22px;padding:26px 16px 28px;text-align:center;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  will-change:transform,opacity}
.fcol .pill{display:inline-block;font:900 34px/1 MT;letter-spacing:-.01em;padding:14px 22px;
  border-radius:13px;background:#fff;color:var(--ink);margin-bottom:20px}
.fcol.b .pill{background:var(--y)}
.fcol p{font:600 26px/1.30 IN;color:rgba(255,255,255,.84)}
#finFoot{text-align:center;margin-top:30px;font:italic 600 46px/1.16 PF;color:#fff}
#finFoot b{font:900 46px/1.16 MT;font-style:normal;color:var(--y)}

#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:20}
</style>

<div id="stage">
  <div id="plate"></div>

  <div id="eqn">
    <div id="eqRow">
      <div class="plate a" id="eqA"><div class="n">BMW 5</div><div class="s">sedan</div></div>
      <div id="eqSign">=</div>
      <div class="plate b" id="eqB"><div class="n">GOLF</div><div class="s">dizel · otomatik</div></div>
    </div>
    <div id="eqLab">aynı bütçe</div>
  </div>

  <div id="gauge">
    <div id="gaLab">sokaktaki algı</div>
    <div id="gaBar"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="gaTag">gemi gibi</div>
  </div>

  <div id="ask">
    <div id="askLab">kimse sormuyor</div>
    <div class="askRow"><b></b><span>Airbag açılmış mı?</span></div>
    <div class="askRow"><b></b><span>Kilometre gerçek mi?</span></div>
  </div>

  <div id="stack"></div>

  <div id="imp">
    <div id="impTxt">BMW!</div>
    <i id="impRule"></i>
    <div id="impSub">der</div>
  </div>

  <div id="fin">
    <div id="finLab">özet</div>
    <div id="finCols">
      <div class="fcol a" id="fc1"><div class="pill">BMW 5</div><p>gemi gibi görünürsün</p></div>
      <div class="fcol b" id="fc2"><div class="pill">GOLF</div><p>başın hiç ağrımaz</p></div>
    </div>
    <div id="finFoot"><b>aynı para,</b><br>farklı hikâye.</div>
  </div>

  <div id="who"><span></span></div>
  <div id="cap"><div id="capTxt"></div></div>
  <div id="flash"></div>
</div>

<script>
/* ============================================================
   Kinetik altyazı + motion graphics motoru — window.setT(saniye)
   ============================================================ */
const D = 17.71;

const cl=(x,a=0,b=1)=>x<a?a:(x>b?b:x);
const outExpo=x=>x>=1?1:1-Math.pow(2,-10*x);
const outCubic=x=>1-Math.pow(1-x,3);
const inOutCubic=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const spring=x=>x>=1?1:1-Math.pow(2,-10*x)*Math.cos(x*Math.PI*3.0);
const lerp=(a,b,x)=>a+(b-a)*x;
const px=v=>v.toFixed(2)+'px';
const show=(el,on)=>{ el.style.display=on?'':'none'; };

/* ---------- altyazı verisi (gömülü altyazıdan çıkarıldı) ---------- */
const AK='ALİ KITAY', AS='ARAÇ SAHİBİ';
const CAPS=[
 /* Konuşma, 0.6–1.0 sn'lik öbeklere bölündü: ekranda hep 2–4 kelime durur.
    İşaretler:  *kelime = vurgu rengi   ~kelime = italik serif (alıntı)      */
 {a: 0.00,b: 0.86,who:AK,w:['Dizel','otomatik']},
 {a: 0.86,b: 1.70,who:AK,w:['-bir','*GOLF','*PARASINA']},
 {a: 1.70,b: 2.53,who:AK,w:['-bu','arabayı','alabilirsiniz.']},
 {a: 2.53,b: 3.26,who:AK,w:['Yanınıza','-bir','gacı']},
 {a: 3.26,b: 3.98,who:AK,w:['oturttuğunuz','zamanda']},
 {a: 3.98,b: 4.78,who:AK,w:['~“Ulan','~arabaya','~bak']},
 {a: 4.78,b: 5.57,who:AK,w:['*~GEMİ','*~GİBİ”','-der.']},
 /* 5.57–6.34 impact sahnesi altyazıyı devralır */
 {a: 6.34,b: 7.18,who:AK,w:['Demez','-ki','~“Bu','~arabanın']},
 {a: 7.18,b: 8.01,who:AK,w:['*~AIRBAGLERİ','~açık.”']},
 {a: 8.01,b: 8.91,who:AK,w:['demez','-ki','~“Bu','~arabanın']},
 {a: 8.91,b: 9.81,who:AK,w:['*~KİLOMETRESİ','~yüksek.”']},
 {a: 9.81,b:10.78,who:AK,w:['Yani,','*KONFORLU']},
 {a:10.78,b:11.75,who:AK,w:['-da','-bir','araba','yani.']},
 {a:11.75,b:12.33,who:AS,w:['Ben','-çok','seviyorum']},
 {a:12.33,b:12.91,who:AS,w:['-abi','arabayı.']},
 /* 12.91–15.06 istif listesi */
 {a:15.06,b:15.80,who:AS,w:['*Golf','alırsın.']},
 {a:15.80,b:16.76,who:AK,w:['Yani','dizel','otomatik']},
 {a:16.76,b:17.71,who:AK,w:['-bir','*GOLF','alır','geçersin.']},
];
/* 12.91–15.06 arası istif listesiyle anlatılır (görüntü ffmpeg'de blurlanır) */
const STACK={a:12.91,b:15.06,lines:['Ama diğer taraftan','başım hiç','ağrımasın','diyorsan da']};

/* Grafik anları — her biri altyazının söylemediği bir şeyi gösterir,
   metni büyütüp tekrarlamaz.                                            */
const T={
  eqn  :[0.88, 2.55],   // tez: BMW 5 = Golf, aynı bütçe
  gauge:[4.10, 5.52],   // "gemi gibi" -> algı çubuğu dolar
  imp  :[5.57, 6.36],   // "BMW!" vuruşu
  ask  :[6.44, 9.74],   // kimse sormuyor: airbag / kilometre
  fin  :[16.22, D],     // özet kartı
};
const FLASH=[5.57,12.91,15.80];

/* ---------- kelime kelime altyazı ---------- */
let capKey='';
function renderCap(seg){
  const k=seg.a+'|'+seg.b;
  if(k===capKey) return;
  capKey=k;
  capTxt.innerHTML=seg.w.map(t=>{
    let hi=false,q=false,sm=false;
    while('*~-'.indexOf(t[0])>-1){
      if(t[0]==='*')hi=true; else if(t[0]==='~')q=true; else sm=true;
      t=t.slice(1);
    }
    /* vurgu kelimeleri harf harf açılsın diye tek tek sarılır */
    const inner = hi ? [...t].map(c=>'<span class="ch">'+c+'</span>').join('') : t;
    return '<span class="wi'+(hi?' hi':'')+(q?' q':'')+(sm?' sm':'')+'">'+inner+'</span>';
  }).join(' ');
}
function capIn(seg,l,dur){
  const ws=[...capTxt.querySelectorAll('.wi')];
  /* Kelimeler öbeğin ilk yarısında sırayla belirir. Beliren kelime kısa bir an
     vurgu rengine çalıp beyaza oturur — STYLE.md §6'daki karaoke tekniği:
     her kelime tek başına görünür bir olay yaratır.                        */
  const span=Math.min(.42,Math.max(.20,dur*.46)), per=span/ws.length;
  ws.forEach((w,i)=>{
    const p=cl((l-i*per)/Math.max(.16,per*1.9));
    const e=spring(p);
    w.style.opacity=cl(p*2.4).toFixed(3);
    w.style.transform='translate3d(0,'+px((1-e)*26)+',0) scale('+lerp(.62,1,e).toFixed(4)+')';
    const chs=w.querySelectorAll('.ch');
    if(chs.length){                                  /* vurgu: harfler kademeli */
      chs.forEach((c,j)=>{
        const cp=cl((p-j*.055/Math.max(1,chs.length*.09))*1.0), ce=spring(cp);
        c.style.opacity=cl(cp*2.2).toFixed(3);
        c.style.transform='translate3d(0,'+px((1-ce)*20)+',0) rotate('+
                          ((1-ce)*-7).toFixed(2)+'deg)';
      });
      w.style.transform='translate3d(0,'+px((1-e)*14)+',0)';
    }
    if(!w.classList.contains('hi')){
      const flash=Math.exp(-Math.pow((p-.42)/.30,2));        // p≈.42'de tepe
      w.style.color='rgb('+Math.round(lerp(255,255,flash))+','
                         +Math.round(lerp(255,201,flash))+','
                         +Math.round(lerp(255, 60,flash))+')';
      w.style.textShadow=flash>.15
        ? '0 0 '+px(flash*26)+' rgba(255,201,60,'+(flash*.55).toFixed(2)+')'
        : '';
    }
  });
}

window.setT=function(t){
  /* ---------- hangi altyazı segmenti ---------- */
  const seg=CAPS.find(s=>t>=s.a&&t<s.b);
  const inStack=t>=STACK.a&&t<STACK.b;
  const inImp=t>=T.imp[0]&&t<T.imp[1];      /* impact sahnesi altyazıyı devralır */
  show(cap,!!seg&&!inImp); show(who,!!seg&&!inImp);
  show(plate, !!seg && !inImp);
  if(seg){
    const dur=seg.b-seg.a, l=t-seg.a, o=cl((seg.b-t)/.16);
    renderCap(seg);
    capIn(seg,l,dur);
    cap.style.opacity=(cl(l/.10)*o).toFixed(3);
    /* konuşmacı çipi */
    who.className = seg.who===AS?'guest':'';
    who.firstElementChild.textContent=seg.who;
    const k=spring(cl(l/.5));
    who.style.opacity=(cl(l/.14)*o).toFixed(3);
    who.firstElementChild.style.transform=
      'translate3d(0,'+px((1-k)*-16)+',0) scale('+lerp(.7,1,k).toFixed(4)+')';
  }
  if(inStack){
    const l=t-STACK.a, dur=STACK.b-STACK.a, o=cl((STACK.b-t)/.22);
    plate.style.opacity=(cl(l/.2)*o*.55).toFixed(3);
  } else if(seg){
    plate.style.opacity='1';
  }

  /* ---------- istif listesi ---------- */
  {
    show(stack,inStack);
    if(inStack){
      const l=t-STACK.a, dur=STACK.b-STACK.a;
      if(stack.dataset.k!=='1'){
        stack.innerHTML=STACK.lines.map(x=>'<div>'+x+'</div>').join('');
        stack.dataset.k='1';
      }
      const per=(dur*.72)/STACK.lines.length;
      [...stack.children].forEach((el,i)=>{
        const p=cl((l-i*per)/Math.max(.2,per*1.5)), e=spring(p);
        el.style.opacity=cl(p*2.4).toFixed(3);
        el.style.transform='translate3d('+px((1-e)*-40)+',0,0)';
        el.className = (i===Math.min(STACK.lines.length-1,Math.floor(l/per)))?'cur':'';
      });
      stack.style.opacity=outCubic(cl((STACK.b-t)/.24)).toFixed(3);
    }
  }

  /* ---------- 1) DENKLEM ---------- */
  {
    const e=t>=T.eqn[0]&&t<T.eqn[1];
    show(eqn,e);
    if(e){
      const l=t-T.eqn[0], o=outCubic(cl((T.eqn[1]-t)/.30));
      [[eqA,-150,0],[eqB,150,.08]].forEach(([el,dx,d])=>{
        const k=outExpo(cl((l-d)/.62));
        el.style.opacity=(cl((l-d)/.18)*o).toFixed(3);
        el.style.transform='translate3d('+px((1-k)*dx)+',0,0) scale('+lerp(.92,1,k).toFixed(4)+')';
      });
      const sg=spring(cl((l-.30)/.55));
      eqSign.style.opacity=(cl((l-.30)/.16)*o).toFixed(3);
      eqSign.style.transform='scale('+lerp(.2,1,sg).toFixed(4)+') rotate('+((1-sg)*-25).toFixed(1)+'deg)';
      const lb=outExpo(cl((l-.52)/.5));
      eqLab.style.opacity=(lb*o).toFixed(3);
      eqLab.style.transform='translate3d(0,'+px((1-lb)*14)+',0)';
    }
  }

  /* ---------- 2) ALGI ÇUBUĞU ---------- */
  {
    const e=t>=T.gauge[0]&&t<T.gauge[1];
    show(gauge,e);
    if(e){
      const l=t-T.gauge[0], o=outCubic(cl((T.gauge[1]-t)/.28));
      gauge.style.opacity=(cl(l/.16)*o).toFixed(3);
      const cells=[...gaBar.children], per=.085;
      cells.forEach((c,i)=>{
        const k=spring(cl((l-.16-i*per)/.42));
        c.style.transform='scaleY('+lerp(.35,1,k).toFixed(3)+')';
        c.style.backgroundColor = k>.5
          ? (i>=cells.length-2?'#FFC93C':'rgba(255,255,255,.92)')
          : 'rgba(255,255,255,.18)';
      });
      const tg=spring(cl((l-.16-cells.length*per)/.55));
      gaTag.style.opacity=cl((l-.16-cells.length*per)/.2).toFixed(3);
      gaTag.style.transform='scale('+lerp(.6,1,tg).toFixed(4)+')';
    }
  }

  /* ---------- BMW impact ---------- */
  {
    const e=t>=T.imp[0]&&t<T.imp[1];
    show(imp,e);
    if(e){
      const l=t-T.imp[0], o=outCubic(cl((T.imp[1]-t)/.16));
      imp.style.opacity=(cl(l/.06)*o).toFixed(3);
      const k=outExpo(cl(l/.30));
      impTxt.style.transform='scale('+lerp(1.55,1,k).toFixed(4)+')';
      impTxt.style.opacity=cl(l/.05).toFixed(3);
      impTxt.className='sh';
      const r=outExpo(cl((l-.14)/.42));
      impRule.style.width=px(r*300);
      impRule.style.marginLeft=px(r*-150);
      const s2=outExpo(cl((l-.26)/.4));
      impSub.style.opacity=(s2*o).toFixed(3);
    }
  }

  /* ---------- 3) SORULMAYANLAR ---------- */
  {
    const e=t>=T.ask[0]&&t<T.ask[1];
    show(ask,e);
    if(e){
      const l=t-T.ask[0], o=outCubic(cl((T.ask[1]-t)/.32));
      const k=outExpo(cl(l/.55));
      ask.style.opacity=(cl(l/.18)*o).toFixed(3);
      ask.style.transform='translate3d('+px((1-k)*90)+',0,0) scale('+lerp(.94,1,k).toFixed(4)+')';
      const kl=outExpo(cl((l-.12)/.45));
      askLab.style.opacity=kl.toFixed(3);
      /* satırlar konuşmayla eşleşir: airbag ~0.2s, kilometre ~1.6s */
      [[0,.22],[1,1.62]].forEach(([i,d])=>{
        const row=ask.querySelectorAll('.askRow')[i];
        const rk=spring(cl((l-d)/.6));
        row.style.opacity=cl((l-d)/.22).toFixed(3);
        row.style.transform='translate3d(0,'+px((1-rk)*22)+',0)';
      });
    }
  }

  /* ---------- final özet kartı ---------- */
  {
    const e=t>=T.fin[0];
    show(fin,e);
    if(e){
      const l=t-T.fin[0], k=outExpo(cl(l/.8));
      fin.style.opacity=cl(l/.18).toFixed(3);
      fin.style.transform='translate3d(0,'+px((1-k)*70)+',0) scale('+lerp(.90,1,k).toFixed(4)+')';
      [[fc1,.20],[fc2,.34]].forEach(([el,d])=>{
        const s=spring(cl((l-d)/.66));
        el.style.opacity=cl((l-d)/.22).toFixed(3);
        el.style.transform='translate3d(0,'+px((1-s)*40)+',0) scale('+lerp(.86,1,s).toFixed(4)+')';
      });
      const f=outExpo(cl((l-.62)/.6));
      finFoot.style.opacity=f.toFixed(3);
      finFoot.style.transform='translate3d(0,'+px((1-f)*22)+',0)';
    }
  }

  /* ---------- geçiş flaşı ---------- */
  {
    let f=0;
    FLASH.forEach(a=>{ const l=t-a; if(l>=0&&l<.22) f=Math.max(f,(1-l/.22)*.30); });
    flash.style.opacity=f.toFixed(4);
  }
};

window.setT(0);
document.documentElement.dataset.ready='1';
</script>
