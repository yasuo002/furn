<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="sahne.css"></head>
<body><div id="stage"></div>
<script src="motor.js"></script>
<script>
(function(){
  const q = new URLSearchParams(location.search);
  window.__MOD = q.get('mod') || 'onizleme';
  window.__hazir = false;
  window.__yukle = function(plan){
    kurSahne(document.getElementById('stage'), plan, window.__MOD);
    window.__hazir = true;
  };
  window.__render = function(t){ cizSahne(t); };
  window.__plaka = async function(url){
    const ims = document.querySelectorAll('img.plaka');
    await Promise.all([...ims].map(im => new Promise(r=>{
      if(im.src.endsWith(url)) return r();
      im.onload=()=>r(); im.onerror=()=>r(); im.src=url;
    })));
  };
  // export modunda plan dosyadan gelir
  if (q.get('plan')) {
    fetch(q.get('plan')).then(r=>r.json()).then(p=>window.__yukle(p));
  } else {
    window.addEventListener('message', ev => {
      if (ev.data && ev.data.tur === 'plan') window.__yukle(ev.data.plan);
      if (ev.data && ev.data.tur === 'zaman') cizSahne(ev.data.t);
    });
    parent.postMessage({tur:'sahne_hazir'}, '*');
  }
})();
</script>
</body></html>
